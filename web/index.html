<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backlot — AI film production studio</title>
    <script>
      // Apply the saved theme before first paint so there is no flash. Default: dark.
      (function () {
        try {
          document.documentElement.dataset.theme = localStorage.getItem('backlot-theme') || 'dark';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
